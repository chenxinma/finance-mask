[project]
name = "finance-mask"
version = "0.1.0"
description = "财务文件智能脱敏工具 - 自动扫描、脱敏、水印嵌入"
readme = "README.md"
authors = [
    { name = "chenxin.ma", email = "chenxin.ma@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "pandas>=2.0.0",
]

[project.scripts]
finance-mask = "finance_mask:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
