[package]
name = "finance-mask-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "finance_mask_core"
path = "src/lib.rs"

[[bin]]
name = "finance-mask"
path = "src/main.rs"

[dependencies]
calamine = "0.32"
quick-xml = "0.36"
zip = "2"
fancy-regex = "0.14"
regex = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
chrono = "0.4"
comfy-table = "7"

[dev-dependencies]
tempfile = "3"
